name: Deploy to gh-pages (no-uses)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo and publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Use pure git — no marketplace actions, nothing to download.
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git work
          cd work
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # Build a fresh gh-pages with just the static site contents.
          git checkout --orphan gh-pages
          rm -rf .github || true
          rm -f assets/plant.json || true
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f origin gh-pages
